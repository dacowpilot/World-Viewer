<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Viewer | Live Earth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-panel">
        <div class="eyebrow">EARTH OBSERVATION</div>
        <h1>World Viewer</h1>
        <p class="intro">
          The latest available global true-color image from NASA's VIIRS
          satellite instrument.
        </p>
        <div class="search-wrap">
          <span>⌕</span
          ><input
            id="search-input"
            type="search"
            placeholder="Search a place..."
          /><button id="search-button" aria-label="Search">Enter</button>
        </div>
        <div class="control-block date-block">
          <label for="date-input">CAPTURE DATE <span>2 DAY DELAY</span></label
          ><input id="date-slider" type="range" min="0" max="30" value="0" />
          <div class="timeline-labels">
            <span>30 DAYS AGO</span><span>LATEST</span>
          </div>
          <input id="date-input" type="date" hidden />
        </div>
        <div class="quick-tools">
          <button id="weather-button">WEATHER HERE</button
          ><button id="iss-button">SHOW ISS</button>
        </div>
        <div class="panel-footer">
          <span class="pulse-ring"></span
          ><span id="feed-message">Receiving orbital imagery</span
          ><button
            class="refresh-button"
            id="refresh-button"
            title="Refresh imagery"
          >
            REFRESH
          </button>
        </div>
      </aside>
      <section class="map-stage" aria-label="Interactive satellite map">
        <div id="map"></div>
        <div class="map-hint">
          DRAG TO EXPLORE <span>•</span> SCROLL TO ZOOM
        </div>
        <div class="coordinate-readout" id="coordinates">
          LAT 0.0000° &nbsp; LON 0.0000°
        </div>
        <div class="weather-readout" id="weather-readout" hidden></div>
      </section>
      <div class="map-meta">
        <span id="zoom-readout">ZOOM 2</span><span class="meta-divider"></span
        ><span id="resolution-readout">MAX NATIVE ZOOM</span
        ><span class="meta-divider"></span
        ><span id="date-readout">IMAGERY —</span>
      </div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      crossorigin=""
    ></script>
    <script src="script.js"></script>
  </body>
</html>
